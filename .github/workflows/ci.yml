name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # `just` used to be installed by piping https://just.systems/install.sh
      # into bash. That script resolves the latest release through the GitHub
      # API unauthenticated, so it is rate-limited per runner IP and returned
      # `curl: (22) ... error: 403` on a main push (run 35286848913) minutes
      # after an identical run had passed. This action makes the same download
      # with the job's GITHUB_TOKEN, which is not subject to that shared limit.
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Format check
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Type check
        run: just typecheck

      - name: Run golden test suite + unit tests
        run: just test-all

      - name: Coverage (unit tests + golden harnesses combined)
        run: just coverage

      - name: End-to-end smoke test
        run: just run examples/hello.no

  commitlint:
    runs-on: ubuntu-latest
    # The repo default GITHUB_TOKEN permissions are read-only and don't
    # extend to listing a PR's commits, which wagoid/commitlint-github-action
    # needs on the `pull_request` trigger -- without this it fails with
    # "Resource not accessible by integration" regardless of whether the
    # commits themselves are compliant.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - uses: wagoid/commitlint-github-action@v6
