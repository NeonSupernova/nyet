name: Windows demo package

# Manual only -- this downloads a ~360MB toolchain and runs
# PyInstaller, which is unnecessary weight on every push. Trigger from
# the Actions tab (or `gh workflow run windows-package.yml`) when you
# need a fresh nyet-windows-demo.zip.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release to the public NeonSupernova/nyet-releases repo"
        type: boolean
        default: true
      prerelease:
        description: "Mark as a pre-release (WARNING: breaks the /releases/latest/ download link)"
        type: boolean
        default: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Windows bundle
        shell: pwsh
        env:
          # Raises fetch_clang.ps1's GitHub API calls from 60/hr
          # (unauthenticated, shared per-IP -- easy to exhaust on a
          # busy shared runner IP) to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging\build_windows.ps1

      - name: Smoke test -- bundled nyet.exe against its bundled clang
        shell: pwsh
        run: |
          $bundle = "packaging\dist\bundle"
          $exe = "$bundle\nyet.exe"
          $failures = New-Object System.Collections.Generic.List[string]

          # Deliberately NOT wrapped in a reusable function/scriptblock:
          # an earlier version of this script called `& $exe ...` from
          # inside a `[scriptblock]$Body` parameter invoked via `& $Body`
          # in a helper function, and EVERY SUCH CALL silently lost its
          # `-o` value (nyet received the input file's own path as the
          # output name instead) while calls written as plain inline
          # code right here in the step always passed their arguments
          # through correctly. Never fully root-caused (no Windows
          # machine to debug interactively) but the fix is simple: keep
          # every `& $exe ...` invocation as plain top-level code, one
          # try/catch per check, no indirection.

          Write-Host "--- run demo/01_hello.no ---"
          try {
              $out = & $exe run examples\tour\01_hello.no 2>&1 | Out-String
              Write-Host $out
              if ($LASTEXITCODE -ne 0) { throw "failed to build/run" }
              if ($out -notmatch "hello from Nyet!") { throw "unexpected output" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("01_hello.no") }

          Write-Host "--- check demo/03_ownership.no (should pass) ---"
          try {
              & $exe check examples\tour\03_ownership.no
              if ($LASTEXITCODE -ne 0) { throw "should have passed check" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("03_ownership.no") }

          Write-Host "--- check demo/03_ownership_bad.no (should fail) ---"
          try {
              & $exe check examples\tour\03_ownership_bad.no
              if ($LASTEXITCODE -eq 0) { throw "should have failed check" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("03_ownership_bad.no") }

          Write-Host "--- bare shorthand: nyet -o smoketest.exe demo/05_closures.no ---"
          try {
              & $exe -o smoketest.exe examples\tour\05_closures.no
              if ($LASTEXITCODE -ne 0) { throw "bare -o shorthand build failed" }
              if (-not (Test-Path smoketest.exe)) { throw "smoketest.exe wasn't produced" }
              $out2 = & .\smoketest.exe 2>&1 | Out-String
              Write-Host $out2
              if ($LASTEXITCODE -ne 0) { throw "smoketest.exe failed to run" }
              if ($out2 -notmatch "product = 120") { throw "unexpected output" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("05_closures.no") }

          # Explicit, distinct -o per file: `run` defaults to a bare
          # "output"/"output.exe" with no -o given, and the very first
          # step above (`run examples\tour\01_hello.no`) already produced one of
          # those in this same working directory. Written out longhand
          # (not a foreach over a name list) for the same reason as the
          # note above -- keep every invocation as plain, direct,
          # top-level code.
          #
          # Source path: demo\features\ only exists *inside the bundle*
          # ($bundle\demo\features\, populated by build_windows.ps1 from
          # tests\codegen\*.no) -- it's never a real repo-root directory
          # (demo/*.no is gitignore-excepted, but not demo/features/*.no).
          # An earlier version of this step pointed at the bare
          # `demo\features\...` path, which doesn't exist here, and
          # `nyet build` on a missing entry file used to silently compile
          # an *empty* program (no diagnostics, no `main`) instead of
          # erroring -- so it "succeeded" all the way to a baffling
          # `undefined reference to WinMain` link error (no `main` symbol
          # for the linker's console-subsystem CRT object, so it fell
          # back looking for a GUI-subsystem entry point instead). Fixed
          # at the source in pynyet/driver.py (missing entry file is now
          # a hard, immediate error) as well as here.

          Write-Host "--- demo/features/ansi_lib.no ---"
          try {
              & $exe -o ansi_lib.exe $bundle\demo\features\ansi_lib.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $fout = & .\ansi_lib.exe 2>&1 | Out-String
              Write-Host $fout
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("ansi_lib.no") }

          Write-Host "--- demo/features/char_printing.no ---"
          try {
              & $exe -o char_printing.exe $bundle\demo\features\char_printing.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $fout = & .\char_printing.exe 2>&1 | Out-String
              Write-Host $fout
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("char_printing.no") }

          Write-Host "--- demo/features/file_read_lines.no ---"
          try {
              & $exe -o file_read_lines.exe $bundle\demo\features\file_read_lines.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $fout = & .\file_read_lines.exe 2>&1 | Out-String
              Write-Host $fout
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("file_read_lines.no") }

          Write-Host "--- demo/features/string_len.no ---"
          try {
              & $exe -o string_len.exe $bundle\demo\features\string_len.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $fout = & .\string_len.exe 2>&1 | Out-String
              Write-Host $fout
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("string_len.no") }

          Write-Host "--- minibase, standalone (exercises (use minibase_repl) -> (use minibase_core)) ---"
          try {
              & $exe -o minibase.exe demos\minibase\main.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $mbOut = "seed`nlist`nsearch`nal`nquit`n" | & .\minibase.exe 2>&1 | Out-String
              Write-Host $mbOut
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
              if ($mbOut -notmatch "inserted #1: Alice") { throw "unexpected output" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("minibase") }

          Write-Host "--- the arcade launcher (use)s all five games into one binary ---"
          try {
              & $exe -o arcade.exe demos\arcade\main.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              # Drive it through minibase, game of life (reseed), pipe
              # dreams (a move), and hangman (a repeated guess), then
              # quit each game and the arcade itself -- proves the
              # bundled repo-root _lib/_repl/prelude_*.no data files
              # actually resolve at runtime from a frozen exe, not just
              # that this all compiles. Also, deliberately, exercises
              # every `busy_wait` call site in the suite (reseeding,
              # submitting a pipe-dreams move, a repeated hangman
              # guess) under a wall-clock budget -- `busy_wait` spins on
              # `(now)`, which is backed by libc `clock()`; `(now)`
              # divides raw clock() ticks by a hardcoded
              # 1000000.0-per-second assumption that's only true on
              # POSIX (glibc/macOS libc) and WRONG on the Windows CRT
              # (1000 ticks/sec there), so a build with that bug fixed
              # incorrectly would make every `busy_wait N` call spin for
              # roughly `N * 1000` real seconds instead of `N` -- e.g. a
              # combined ~2s of intended pauses here would instead take
              # over half an hour. Confirmed via this exact codepath in
              # CI history: the smoke test step took ~10 SECONDS before
              # busy_wait was used anywhere in the suite, and ~10
              # MINUTES once game_of_life/pipe_dreams/hangman started
              # using it (one call actually spinning the intended 0.6s
              # for ~600s) -- a real, previously silent regression this
              # budget exists to catch immediately instead.
              $arcSw = [System.Diagnostics.Stopwatch]::StartNew()
              $arcOut = "1`nseed`nlist`nquit`n`n3`nr`nq`n`n4`n1`nq`n`n5`nz`nz`nquit`n`nq`n" | & .\arcade.exe 2>&1 | Out-String
              $arcSw.Stop()
              Write-Host $arcOut
              Write-Host "arcade playthrough wall-clock time: $($arcSw.Elapsed)"
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
              if ($arcOut -notmatch "N Y E T   A R C A D E") { throw "arcade banner missing" }
              if ($arcOut -notmatch "inserted #1: Alice") { throw "minibase (via arcade) wrong" }
              if ($arcOut -notmatch "Pipe Dreams") { throw "pipe dreams (via arcade) wrong" }
              if ($arcOut -notmatch "already guessed that one") { throw "hangman (via arcade) wrong" }
              # ~2s of real busy_wait is intended; 60s leaves generous
              # headroom for a slow runner while staying two full orders
              # of magnitude below what the CLOCKS_PER_SEC bug produces.
              if ($arcSw.Elapsed.TotalSeconds -gt 60) { throw "took $($arcSw.Elapsed.TotalSeconds)s -- busy_wait/(now) is almost certainly spinning ~1000x too long again" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("arcade") }

          Write-Host "--- bundle\lib\ has the arcade suite's browsable source ---"
          try {
              foreach ($name in @("minibase_core", "minibase_repl", "adventure_lib", "game_of_life_lib", "pipe_dreams_lib", "hangman_lib", "prelude_option", "prelude_rng")) {
                  $libFile = "$bundle\lib\$name.no"
                  if (-not (Test-Path $libFile)) { throw "$libFile missing from bundle" }
              }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("bundle-lib") }

          Write-Host ""
          if ($failures.Count -gt 0) {
              Write-Host "FAILED: $($failures -join ', ')"
              throw "$($failures.Count) smoke test(s) failed"
          }
          Write-Host "All smoke tests passed."

      - name: Read the compiler version
        id: ver
        shell: pwsh
        run: |
          # pynyet/__init__.py's __version__ is the single source of
          # truth for the release tag -- cutting a release means
          # bumping that line and running this workflow, nothing else.
          $v = (python -c "import pynyet; print(pynyet.__version__)").Trim()
          if (-not $v) { throw "could not read pynyet.__version__" }
          Write-Host "version = $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stage release assets
        shell: pwsh
        run: |
          $rel = "packaging\dist\release"
          New-Item -ItemType Directory -Path $rel -Force | Out-Null

          # Deliberately an UNVERSIONED asset name: it's what makes
          # https://github.com/NeonSupernova/nyet-releases/releases/latest/download/nyet-windows-x64.zip
          # a permanent link that always resolves to the newest build.
          # The version lives in the release tag, not the file name.
          Move-Item packaging\dist\nyet-windows-demo.zip "$rel\nyet-windows-x64.zip" -Force

          Push-Location $rel
          $h = Get-FileHash nyet-windows-x64.zip -Algorithm SHA256
          # Two-space separator, matching sha256sum(1)'s own format, so
          # `sha256sum -c SHA256SUMS.txt` works as-is for anyone on a
          # machine that has it.
          #
          # Written via WriteAllText rather than Set-Content because
          # Set-Content terminates lines with CRLF on Windows, and
          # sha256sum/shasum then look for a file whose name ends in a
          # literal carriage return -- "FAILED open or read" on every
          # non-Windows machine, for a file that is actually fine.
          # Verified against the real published asset; do not "simplify"
          # this back to Set-Content.
          $line = "$($h.Hash.ToLower())  nyet-windows-x64.zip`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "SHA256SUMS.txt"), $line)
          Get-Content SHA256SUMS.txt
          Write-Host "zip size: $([math]::Round((Get-Item nyet-windows-x64.zip).Length / 1MB))MB"
          Pop-Location

      - name: Compose release notes
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $tc = Get-Content packaging\dist\toolchain.json -Raw | ConvertFrom-Json

          # Built as a string array rather than a here-string: the notes
          # contain both `$`-prefixed words and backslash Windows paths,
          # and a here-string would expand or mangle them.
          $lines = @(
            "## Download",
            "",
            "**nyet-windows-x64.zip** -- Windows x64. Unzip it anywhere, run ``add-to-path.bat``, then:",
            "",
            "``````",
            "nyet run demo\01_hello.no",
            "``````",
            "",
            "No installer, no admin rights, and nothing else needs to be on the machine -- the",
            "bundled toolchain is what makes the download large.",
            "",
            "Verify the download against ``SHA256SUMS.txt``:",
            "",
            "``````powershell",
            "Get-FileHash nyet-windows-x64.zip -Algorithm SHA256",
            "``````",
            "",
            "## What is in the bundle",
            "",
            "| | |",
            "|---|---|",
            "| ``nyet.exe`` | The compiler. ``nyet --version`` prints ``nyet $version``. |",
            "| ``clang\`` | The bundled C/LLVM toolchain ``nyet`` links with. |",
            "| ``demo\`` | Short programs, one language feature each. Start with ``01_hello.no``. |",
            "| ``arcade\`` | Five small games behind one menu: ``nyet run arcade\main.no``. |",
            "| ``lib\`` | The arcade's actual source, in readable Nyet. |",
            "| ``main.no`` | The language reference, in one commented file. |",
            "",
            "## Bundled toolchain",
            "",
            "This build redistributes WinLibs ``$($tc.releaseTag)`` (``$($tc.asset)``, published $($tc.publishedAt)).",
            "Some components in it are GPL-licensed, which entitles you to the matching source code;",
            "WinLibs publishes it with that release:",
            "",
            "- $($tc.releaseUrl)",
            "",
            "See [THIRD-PARTY-NOTICES.md](https://github.com/NeonSupernova/nyet-releases/blob/main/THIRD-PARTY-NOTICES.md)",
            "for the full breakdown.",
            "",
            "## Changes",
            "",
            "See [CHANGELOG.md](https://github.com/NeonSupernova/nyet-releases/blob/main/CHANGELOG.md).",
            "",
            "## Reporting a problem",
            "",
            "[Open an issue](https://github.com/NeonSupernova/nyet-releases/issues/new/choose) with the",
            "version above, the ``.no`` program, and the exact output."
          )
          Set-Content -Path packaging\dist\release\NOTES.md -Value $lines -Encoding utf8
          Write-Host "--- release notes ---"
          Get-Content packaging\dist\release\NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: nyet-windows-demo
          path: |
            packaging/dist/release/nyet-windows-x64.zip
            packaging/dist/release/SHA256SUMS.txt
            packaging/dist/release/NOTES.md
          retention-days: 30

      # Everything below publishes to the PUBLIC repo. This repo is
      # private, so its own releases and artifacts are private too --
      # NeonSupernova/nyet-releases is the only place an anonymous
      # download can come from. The built-in GITHUB_TOKEN cannot write
      # to another repository, hence a separate fine-grained PAT in
      # secrets.RELEASE_TOKEN (contents: write, scoped to that one repo).
      - name: Publish the release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $repo = "NeonSupernova/nyet-releases"

          if (-not $env:GH_TOKEN) {
            throw "secrets.RELEASE_TOKEN is not set -- see packaging/RELEASING.md for how to create it."
          }

          # Refuse to overwrite a download people may already have a
          # link to -- bumping __version__ is the intended way forward.
          # Checked with `release list` rather than `release view`: view
          # exits nonzero and writes to stderr for the (normal, expected)
          # case of the tag not existing yet, which is awkward to
          # distinguish from a real failure. list exits 0 even with no
          # releases at all.
          $existing = gh release list --repo $repo --limit 200 --json tagName --jq ".[].tagName"
          if ($LASTEXITCODE -ne 0) { throw "could not list releases on $repo -- is RELEASE_TOKEN valid and scoped to it?" }
          if ($existing -contains $tag) {
            throw "$tag already exists on $repo. Bump __version__ in pynyet/__init__.py and re-run."
          }

          # Not named $args: that is a PowerShell automatic variable.
          $ghArgs = @(
            "release", "create", $tag,
            "--repo", $repo,
            "--title", "Nyet $tag",
            "--notes-file", "packaging\dist\release\NOTES.md"
          )
          # GitHub's /releases/latest/ resolves to the newest
          # NON-prerelease release. Marking a release as a pre-release
          # therefore 404s the permanent download link the public
          # README points at -- observed on the first v0.3.0 publish.
          # Defaults to false for that reason; only pass true when the
          # public README is not pointing at this build.
          if ("${{ inputs.prerelease }}" -eq "true") {
            Write-Host "::warning::Publishing as a pre-release -- /releases/latest/download/nyet-windows-x64.zip will 404 until a non-prerelease build is published."
            $ghArgs += "--prerelease"
          }
          $ghArgs += "packaging\dist\release\nyet-windows-x64.zip"
          $ghArgs += "packaging\dist\release\SHA256SUMS.txt"

          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          Write-Host "Published https://github.com/$repo/releases/tag/$tag"

      - name: Sync examples/ into the public repo
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # The public repo mirrors the demo sources so the language can
          # be read on the web without downloading 400MB. Regenerated
          # from this repo on every release so the two cannot drift.
          python packaging/stage_public_examples.py --out "$env:RUNNER_TEMP\examples"

          $env:GIT_TERMINAL_PROMPT = "0"
          git clone --quiet --depth 1 "https://x-access-token:$env:GH_TOKEN@github.com/NeonSupernova/nyet-releases.git" "$env:RUNNER_TEMP\public"
          if ($LASTEXITCODE -ne 0) { throw "could not clone the public repo" }
          $pub = "$env:RUNNER_TEMP\public"

          # examples/LICENSE is the public repo's own file, not generated
          # from here -- preserve it across the wipe-and-replace.
          $license = "$pub\examples\LICENSE"
          $keep = if (Test-Path $license) { Get-Content $license -Raw } else { $null }

          if (Test-Path "$pub\examples") { Remove-Item "$pub\examples" -Recurse -Force }
          Copy-Item "$env:RUNNER_TEMP\examples" "$pub\examples" -Recurse -Force
          if ($keep) { Set-Content -Path $license -Value $keep -NoNewline }

          Push-Location $pub
          git config user.name "nyet release bot"
          git config user.email "noreply@github.com"
          git add examples
          $changed = git diff --cached --name-only
          if (-not $changed) {
            Write-Host "examples/ already up to date, nothing to sync."
            Pop-Location
            exit 0
          }
          Write-Host "syncing:`n$changed"
          git commit --quiet -m "chore(examples): sync from compiler v${{ steps.ver.outputs.version }}"
          git push --quiet
          if ($LASTEXITCODE -ne 0) { throw "could not push the examples/ sync" }
          Pop-Location
