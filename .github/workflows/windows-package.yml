name: Windows demo package

# Manual only -- this downloads a ~360MB toolchain and runs
# PyInstaller, which is unnecessary weight on every push. Trigger from
# the Actions tab (or `gh workflow run windows-package.yml`) when you
# need a fresh nyet-windows-demo.zip.
#
# workflow_dispatch only works for a workflow file that's on the
# default branch, so while this is still under review on a feature
# branch we also trigger on push to it directly -- drop that block
# once this lands on main and workflow_dispatch works normally.
on:
  workflow_dispatch: {}
  push:
    branches: [arcade/windows-bundle]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Windows bundle
        shell: pwsh
        env:
          # Raises fetch_clang.ps1's GitHub API calls from 60/hr
          # (unauthenticated, shared per-IP -- easy to exhaust on a
          # busy shared runner IP) to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging\build_windows.ps1

      - name: Smoke test -- bundled nyet.exe against its bundled clang
        shell: pwsh
        run: |
          $bundle = "packaging\dist\bundle"
          $exe = "$bundle\nyet.exe"
          $failures = New-Object System.Collections.Generic.List[string]

          # Deliberately NOT wrapped in a reusable function/scriptblock:
          # an earlier version of this script called `& $exe ...` from
          # inside a `[scriptblock]$Body` parameter invoked via `& $Body`
          # in a helper function, and EVERY SUCH CALL silently lost its
          # `-o` value (nyet received the input file's own path as the
          # output name instead) while calls written as plain inline
          # code right here in the step always passed their arguments
          # through correctly. Never fully root-caused (no Windows
          # machine to debug interactively) but the fix is simple: keep
          # every `& $exe ...` invocation as plain top-level code, one
          # try/catch per check, no indirection.

          Write-Host "--- run demo/01_hello.no ---"
          try {
              $out = & $exe run demo\01_hello.no 2>&1 | Out-String
              Write-Host $out
              if ($LASTEXITCODE -ne 0) { throw "failed to build/run" }
              if ($out -notmatch "hello from Nyet!") { throw "unexpected output" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("01_hello.no") }

          Write-Host "--- check demo/03_ownership.no (should pass) ---"
          try {
              & $exe check demo\03_ownership.no
              if ($LASTEXITCODE -ne 0) { throw "should have passed check" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("03_ownership.no") }

          Write-Host "--- check demo/03_ownership_bad.no (should fail) ---"
          try {
              & $exe check demo\03_ownership_bad.no
              if ($LASTEXITCODE -eq 0) { throw "should have failed check" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("03_ownership_bad.no") }

          Write-Host "--- bare shorthand: nyet -o smoketest.exe demo/05_closures.no ---"
          try {
              & $exe -o smoketest.exe demo\05_closures.no
              if ($LASTEXITCODE -ne 0) { throw "bare -o shorthand build failed" }
              if (-not (Test-Path smoketest.exe)) { throw "smoketest.exe wasn't produced" }
              $out2 = & .\smoketest.exe 2>&1 | Out-String
              Write-Host $out2
              if ($LASTEXITCODE -ne 0) { throw "smoketest.exe failed to run" }
              if ($out2 -notmatch "product = 120") { throw "unexpected output" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("05_closures.no") }

          # Explicit, distinct -o per file: `run` defaults to a bare
          # "output"/"output.exe" with no -o given, and the very first
          # step above (`run demo\01_hello.no`) already produced one of
          # those in this same working directory. Written out longhand
          # (not a foreach over a name list) for the same reason as the
          # note above -- keep every invocation as plain, direct,
          # top-level code.

          Write-Host "--- demo/features/ansi_lib.no ---"
          try {
              & $exe -o ansi_lib.exe demo\features\ansi_lib.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $fout = & .\ansi_lib.exe 2>&1 | Out-String
              Write-Host $fout
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("ansi_lib.no") }

          Write-Host "--- demo/features/char_printing.no ---"
          try {
              & $exe -o char_printing.exe demo\features\char_printing.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $fout = & .\char_printing.exe 2>&1 | Out-String
              Write-Host $fout
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("char_printing.no") }

          Write-Host "--- demo/features/file_read_lines.no ---"
          try {
              & $exe -o file_read_lines.exe demo\features\file_read_lines.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $fout = & .\file_read_lines.exe 2>&1 | Out-String
              Write-Host $fout
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("file_read_lines.no") }

          Write-Host "--- demo/features/string_len.no ---"
          try {
              & $exe -o string_len.exe demo\features\string_len.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $fout = & .\string_len.exe 2>&1 | Out-String
              Write-Host $fout
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("string_len.no") }

          Write-Host "--- minibase, standalone (exercises (use minibase_repl) -> (use minibase_core)) ---"
          try {
              & $exe -o minibase.exe minibase\main.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              $mbOut = "seed`nlist`nsearch`nal`nquit`n" | & .\minibase.exe 2>&1 | Out-String
              Write-Host $mbOut
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
              if ($mbOut -notmatch "inserted #1: Alice") { throw "unexpected output" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("minibase") }

          Write-Host "--- the arcade launcher (use)s all five games into one binary ---"
          try {
              & $exe -o arcade.exe arcade\main.no
              if ($LASTEXITCODE -ne 0) { throw "failed to build" }
              # Drive it through minibase (option 1) then pipe dreams
              # (option 4), then quit each game and the arcade itself --
              # proves the bundled repo-root _lib/_repl/prelude_*.no data
              # files actually resolve at runtime from a frozen exe, not
              # just that this all compiles.
              $arcOut = "1`nseed`nlist`nquit`n4`n1`nq`nq`n" | & .\arcade.exe 2>&1 | Out-String
              Write-Host $arcOut
              if ($LASTEXITCODE -ne 0) { throw "failed to run" }
              if ($arcOut -notmatch "N Y E T   A R C A D E") { throw "arcade banner missing" }
              if ($arcOut -notmatch "inserted #1: Alice") { throw "minibase (via arcade) wrong" }
              if ($arcOut -notmatch "Pipe Dreams") { throw "pipe dreams (via arcade) wrong" }
          } catch { Write-Host "[FAIL] $_"; $failures.Add("arcade") }

          Write-Host ""
          if ($failures.Count -gt 0) {
              Write-Host "FAILED: $($failures -join ', ')"
              throw "$($failures.Count) smoke test(s) failed"
          }
          Write-Host "All smoke tests passed."

      - uses: actions/upload-artifact@v4
        with:
          name: nyet-windows-demo
          path: packaging/dist/nyet-windows-demo.zip
          retention-days: 30
